<svg xmlns="http://www.w3.org/2000/svg" width="175" height="24" viewBox="0 0 175 24" role="img" aria-label="Made for GitHub Actions">
  <title>Made for GitHub Actions</title>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#D4D4D8"/>
      <stop offset="1" stop-color="#A1A1AA"/>
    </linearGradient>
    <clipPath id="shape">
      <rect width="175" height="24" rx="8"/>
    </clipPath>
  </defs>
  <g clip-path="url(#shape)">
    <rect width="69" height="24" fill="#3F3F46"/>
    <rect x="69" width="106" height="24" fill="url(#accent)"/>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" text-anchor="middle">
    <text x="34.5" y="16" fill="#F4F4F5">made for</text>
    <text x="122" y="16" fill="#18181B">GitHub Actions</text>
  </g>
</svg>
