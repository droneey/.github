name: 💡 Idea
description: An idea to discuss before it becomes work
type: Idea
body:
  - type: textarea
    id: what
    attributes:
      label: What
      description: What the project could do or do differently
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: What you are trying to do and what stops you
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Links, sources, sketches, anything else that helps
