name: 📋 Task
description: A decided piece of work
type: Task
body:
  - type: textarea
    id: what
    attributes:
      label: What
      description: The work to do
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: What the work gives and who needs it
    validations:
      required: true
  - type: textarea
    id: done
    attributes:
      label: Done when
      description: What is true once the work is finished
    validations:
      required: true
