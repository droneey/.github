name: 📋 Task
description: A decided piece of work
type: Task
body:
  - type: textarea
    id: what
    attributes:
      label: What
      description: The work to do
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: Why
      description: What the work gives and who needs it
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance
      description: What is true once the work is done
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Links, sources, sketches, anything else that helps
