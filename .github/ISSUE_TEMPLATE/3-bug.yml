name: 🐞 Bug
description: Something behaves differently from what the docs say
type: Bug
body:
  - type: textarea
    id: actual
    attributes:
      label: Actual
      description: What you did and what you got
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected
      description: What the docs say, or what you thought would happen
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps
      description: How to make it happen again, one step per line
      placeholder: |
        1.
        2.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The release tag or the commit
      placeholder: v1.2.3 or 1a2b3c4
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Output
      description: Relevant output, with secrets removed
      render: shell
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Links, sources, sketches, anything else that helps
