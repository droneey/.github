name: Changelog
description: Release notes for a tag - the packages it ships and the feat and fix subjects since the previous tag.

inputs:
  tag:
    description: 'The tag the notes describe'
    required: true
  packages:
    description: 'Space-separated globs of the package.json files listed in the notes; empty leaves the section out'
    required: false
    default: ''

outputs:
  body:
    description: 'The notes, in Markdown'
    value: ${{ steps.changelog.outputs.body }}

runs:
  using: composite
  steps:
    - name: 📝 Generate the notes
      id: changelog
      shell: bash
      env:
        TAG: ${{ inputs.tag }}
        REPO: ${{ github.repository }}
        PACKAGES: ${{ inputs.packages }}
      run: |
        set -euo pipefail
        shopt -s nullglob
        PREV_TAG=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sed -n '2p' || true)

        BODY=""
        # shellcheck disable=SC2206
        FILES=($PACKAGES)
        if [ "${#FILES[@]}" -gt 0 ]; then
          BODY="## Packages"$'\n\n'
          for FILE in "${FILES[@]}"; do
            NAME=$(jq -r '.name' "$FILE")
            VERSION=$(jq -r '.version' "$FILE")
            BODY="${BODY}- \`${NAME}@${VERSION}\`"$'\n'
          done
          BODY="${BODY}"$'\n'
        fi

        if [ -n "$PREV_TAG" ]; then
          RANGE="${PREV_TAG}..${TAG}"
          FEATURES=$(git log "$RANGE" --pretty=format:"- %s" --grep="^feat" --no-merges)
          FIXES=$(git log "$RANGE" --pretty=format:"- %s" --grep="^fix\|^hotfix" --no-merges)

          BODY="${BODY}## What's Changed"$'\n\n'
          if [ -n "$FEATURES" ]; then
            BODY="${BODY}### Features"$'\n'"${FEATURES}"$'\n\n'
          fi
          if [ -n "$FIXES" ]; then
            BODY="${BODY}### Fixes"$'\n'"${FIXES}"$'\n\n'
          fi
          BODY="${BODY}**Full Changelog**: https://github.com/${REPO}/compare/${PREV_TAG}...${TAG}"
        else
          BODY="${BODY}Initial release."
        fi

        DELIM="EOF_$(date +%s)_${RANDOM}"
        {
          echo "body<<${DELIM}"
          echo "$BODY"
          echo "${DELIM}"
        } >> "$GITHUB_OUTPUT"
