name: 🚀 Deploy

on:
  release:
    types: [released]

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}
          fetch-depth: 0

      - name: 🏷️ Move the floating major tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          MAJOR="${TAG%%.*}"
          git tag -f "$MAJOR" "$TAG"
          git push -f origin "$MAJOR"
          echo "$MAJOR now points at $TAG"
