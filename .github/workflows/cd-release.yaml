name: 🔖 Release

on:
  workflow_call:
    inputs:
      prerelease:
        description: 'Open the release as a pre-release, to be promoted by hand'
        type: boolean
        required: false
        default: false
      assets-command:
        description: 'Shell run from the tag before the release opens; it builds the files named in assets. Empty builds nothing'
        type: string
        required: false
        default: ''
      assets:
        description: 'Space-separated files attached to the release when it opens, and replaced when a rerun edits it. Empty attaches nothing'
        type: string
        required: false
        default: ''
    secrets:
      token:
        description: 'A personal access token; events of a release opened with it start other workflows, which GITHUB_TOKEN does not'
        required: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Generate the changelog
        id: changelog
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          PREV_TAG=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sed -n '2p' || true)

          BODY=""

          if [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..${TAG}"
            FEATURES=$(git log "$RANGE" --pretty=format:"- %s" --grep="^feat" --no-merges)
            FIXES=$(git log "$RANGE" --pretty=format:"- %s" --grep="^fix\|^hotfix" --no-merges)

            BODY="${BODY}## What's Changed"$'\n\n'
            if [ -n "$FEATURES" ]; then
              BODY="${BODY}### Features"$'\n'"${FEATURES}"$'\n\n'
            fi
            if [ -n "$FIXES" ]; then
              BODY="${BODY}### Fixes"$'\n'"${FIXES}"$'\n\n'
            fi
            BODY="${BODY}**Full Changelog**: https://github.com/${REPO}/compare/${PREV_TAG}...${TAG}"
          else
            BODY="${BODY}Initial release."
          fi

          DELIM="EOF_$(date +%s)_${RANDOM}"
          {
            echo "body<<${DELIM}"
            echo "$BODY"
            echo "${DELIM}"
          } >> "$GITHUB_OUTPUT"

      - name: Build the assets
        if: inputs.assets-command != ''
        env:
          ASSETS_COMMAND: ${{ inputs.assets-command }}
        run: bash -euo pipefail -c "$ASSETS_COMMAND"

      - name: Open or update the release
        env:
          TAG: ${{ github.ref_name }}
          BODY: ${{ steps.changelog.outputs.body }}
          PRERELEASE: ${{ inputs.prerelease }}
          ASSETS: ${{ inputs.assets }}
          GH_TOKEN: ${{ secrets.token || github.token }}
        run: |
          set -euo pipefail
          read -r -a FILES <<< "$ASSETS"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes "$BODY" --prerelease="$PRERELEASE"
            if [ -n "$ASSETS" ]; then
              gh release upload "$TAG" "${FILES[@]}" --clobber
            fi
          else
            gh release create "$TAG" --title "$TAG" --notes "$BODY" --prerelease="$PRERELEASE" ${FILES[@]+"${FILES[@]}"}
          fi
