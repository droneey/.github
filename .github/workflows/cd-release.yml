name: 🔖 Release

on:
  workflow_call:
    inputs:
      prerelease:
        description: 'Open the release as a pre-release, to be promoted by hand'
        type: boolean
        required: false
        default: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 📝 Generate the changelog
        id: changelog
        env:
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          PREV_TAG=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sed -n '2p' || true)

          BODY=""

          if [ -n "$PREV_TAG" ]; then
            RANGE="${PREV_TAG}..${TAG}"
            FEATURES=$(git log "$RANGE" --pretty=format:"- %s" --grep="^feat" --no-merges)
            FIXES=$(git log "$RANGE" --pretty=format:"- %s" --grep="^fix\|^hotfix" --no-merges)

            BODY="${BODY}## What's Changed"$'\n\n'
            if [ -n "$FEATURES" ]; then
              BODY="${BODY}### Features"$'\n'"${FEATURES}"$'\n\n'
            fi
            if [ -n "$FIXES" ]; then
              BODY="${BODY}### Fixes"$'\n'"${FIXES}"$'\n\n'
            fi
            BODY="${BODY}**Full Changelog**: https://github.com/${REPO}/compare/${PREV_TAG}...${TAG}"
          else
            BODY="${BODY}Initial release."
          fi

          DELIM="EOF_$(date +%s)_${RANDOM}"
          {
            echo "body<<${DELIM}"
            echo "$BODY"
            echo "${DELIM}"
          } >> "$GITHUB_OUTPUT"

      - name: 🔖 Open or update the release
        env:
          TAG: ${{ github.ref_name }}
          BODY: ${{ steps.changelog.outputs.body }}
          PRERELEASE: ${{ inputs.prerelease }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release edit "$TAG" --title "$TAG" --notes "$BODY" --prerelease="$PRERELEASE"
          else
            gh release create "$TAG" --title "$TAG" --notes "$BODY" --prerelease="$PRERELEASE"
          fi
