name: 🔖 Release

on:
  workflow_call:
    inputs:
      packages:
        description: 'Space-separated globs of the package.json files listed in the release notes; empty leaves the section out'
        type: string
        required: false
        default: ''
      prerelease:
        description: 'Open the release as a pre-release, to be promoted by hand'
        type: boolean
        required: false
        default: false

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: 📝 Generate the changelog
        id: changelog
        uses: droneey/workflows/.github/actions/changelog@v1
        with:
          tag: ${{ github.ref_name }}
          packages: ${{ inputs.packages }}

      - name: 🔖 Open or update the release
        env:
          TAG: ${{ github.ref_name }}
          BODY: ${{ steps.changelog.outputs.body }}
          PRERELEASE: ${{ inputs.prerelease }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG exists, updating it"
            gh release edit "$TAG" \
              --title "$TAG" \
              --notes "$BODY" \
              --prerelease="$PRERELEASE"
          else
            gh release create "$TAG" \
              --title "$TAG" \
              --notes "$BODY" \
              --prerelease="$PRERELEASE"
          fi
