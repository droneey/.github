name: 🏷️ Version

on:
  workflow_call:
    inputs:
      packages:
        description: 'Space-separated globs of the package.json files that receive the new version; the first one holds the current version'
        type: string
        required: false
        default: package.json
    secrets:
      token:
        description: 'A personal access token; a tag pushed with GITHUB_TOKEN does not trigger other workflows'
        required: true

jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.token }}
          fetch-depth: 2

      - name: 🔎 Determine bump type
        id: bump
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BRANCH=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
            --jq '.[0].head.ref // empty' 2>/dev/null || echo "")

          if [ -z "$BRANCH" ]; then
            BRANCH=$(gh pr list --state merged --search "hash:$GITHUB_SHA" \
              --json headRefName --jq '.[0].headRefName // empty' 2>/dev/null || echo "")
          fi

          if [ -z "$BRANCH" ]; then
            echo "No pull request found for $GITHUB_SHA, skipping the bump"
            echo "type=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PREFIX="${BRANCH%%/*}"
          echo "Source branch: $BRANCH (prefix: $PREFIX)"

          case "$PREFIX" in
            feature) echo "type=minor" >> "$GITHUB_OUTPUT" ;;
            fix|hotfix) echo "type=patch" >> "$GITHUB_OUTPUT" ;;
            *) echo "type=" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: 🏷️ Bump version and tag
        if: steps.bump.outputs.type
        env:
          BUMP: ${{ steps.bump.outputs.type }}
          PACKAGES: ${{ inputs.packages }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          # shellcheck disable=SC2206
          FILES=($PACKAGES)
          [ "${#FILES[@]}" -gt 0 ] || { echo "::error::no package.json matches: $PACKAGES"; exit 1; }

          CURRENT=$(jq -r '.version' "${FILES[0]}")
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"

          if [ "$BUMP" = "minor" ]; then
            MINOR=$((MINOR + 1))
            PATCH=0
          elif [ "$BUMP" = "patch" ]; then
            PATCH=$((PATCH + 1))
          fi

          NEW_VERSION="$MAJOR.$MINOR.$PATCH"
          echo "Bumping $CURRENT to $NEW_VERSION ($BUMP)"

          for FILE in "${FILES[@]}"; do
            jq --arg v "$NEW_VERSION" '.version = $v' "$FILE" > "$FILE.tmp" && mv "$FILE.tmp" "$FILE"
          done

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${FILES[@]}"
          git commit -m "chore: Release v$NEW_VERSION" --no-verify

          git pull --rebase origin "$BRANCH"
          git tag "v$NEW_VERSION"
          git push --atomic origin "HEAD:$BRANCH" "v$NEW_VERSION"
