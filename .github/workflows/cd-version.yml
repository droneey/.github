name: 🏷️ Version

on:
  workflow_call:
    inputs:
      version-command:
        description: 'Shell run with VERSION set before tagging; it writes the version into the project files, and whatever it changed is committed. Empty tags the merge commit as it is'
        type: string
        required: false
        default: ''
    secrets:
      token:
        description: 'A personal access token; a tag pushed with GITHUB_TOKEN does not trigger other workflows'
        required: true
  push:
    branches: [main]

jobs:
  version:
    if: "github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore: Release v')"
    runs-on: ubuntu-latest
    concurrency:
      group: version-${{ github.repository }}
      cancel-in-progress: false
    permissions:
      contents: write
      pull-requests: read
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.token || secrets.GH_TOKEN }}
          fetch-depth: 0

      - name: 🔎 Determine bump type
        id: bump
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          BRANCH=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
            --jq '.[0].head.ref // empty' 2>/dev/null || echo "")

          if [ -z "$BRANCH" ]; then
            BRANCH=$(gh pr list --state merged --search "hash:$GITHUB_SHA" \
              --json headRefName --jq '.[0].headRefName // empty' 2>/dev/null || echo "")
          fi

          if [ -z "$BRANCH" ]; then
            echo "No pull request found for $GITHUB_SHA, skipping the bump"
            echo "type=" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          PREFIX="${BRANCH%%/*}"
          echo "Source branch: $BRANCH (prefix: $PREFIX)"

          case "$PREFIX" in
            feature) echo "type=minor" >> "$GITHUB_OUTPUT" ;;
            fix|hotfix|dependabot|renovate) echo "type=patch" >> "$GITHUB_OUTPUT" ;;
            *) echo "type=" >> "$GITHUB_OUTPUT" ;;
          esac

      - name: 🏷️ Bump version and tag
        if: steps.bump.outputs.type
        env:
          BUMP: ${{ steps.bump.outputs.type }}
          VERSION_COMMAND: ${{ inputs.version-command }}
          BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          LATEST=$(git tag --sort=-v:refname | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | head -1 || true)
          CURRENT="${LATEST#v}"
          [ -n "$CURRENT" ] || CURRENT="0.0.0"
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"

          if [ "$BUMP" = "minor" ]; then
            MINOR=$((MINOR + 1))
            PATCH=0
          else
            PATCH=$((PATCH + 1))
          fi

          VERSION="$MAJOR.$MINOR.$PATCH"
          echo "Bumping $CURRENT to $VERSION ($BUMP)"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ -n "$VERSION_COMMAND" ]; then
            VERSION="$VERSION" bash -euo pipefail -c "$VERSION_COMMAND"
            if ! git diff --quiet; then
              git add -u
              git commit -m "chore: Release v$VERSION" --no-verify
              git pull --rebase origin "$BRANCH"
            fi
          fi

          git tag "v$VERSION"
          git push --atomic origin "HEAD:$BRANCH" "v$VERSION"
