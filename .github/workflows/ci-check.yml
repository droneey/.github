name: ☑️ Check

on:
  pull_request:
    branches: [main]

concurrency:
  group: check-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: 📥 Checkout
        uses: actions/checkout@v6

      - name: 📦 Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: ✅ Validate every workflow
        run: |
          set -euo pipefail
          for file in .github/actions/*/action.yml .github/workflows/*.yml; do
            [ -f "${file}" ] || continue
            echo "${file}"
            bunx --package @action-validator/cli action-validator "${file}"
          done
