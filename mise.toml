[tools]
actionlint = "1.7.12"
betterleaks = "1.8.1"
lefthook = "2.1.14"
ls-lint = "2.3.1"
"github:droneey/devkit" = { version = "1.31.0", asset_pattern = "devkit.tar.gz", strip_components = 0 }

[hooks]
postinstall = [
  "ln -sfn \"$(mise where github:droneey/devkit)\" .devkit",
  "lefthook install",
]

[settings]
lockfile = true

[tool_config]
locked = true

[tasks."workflows:check"]
run = "actionlint -color"

[tasks."secrets:check"]
run = [
  "betterleaks git . --redact --no-banner",
  "betterleaks git . --pre-commit --redact --no-banner",
  "betterleaks git . --pre-commit --staged --redact --no-banner",
]

[tasks."names:check"]
run = "ls-lint --config .devkit/common/ls-lint/base.yaml --config .devkit/common/ls-lint/markdown.yaml --config .ls-lint.yaml"

[tasks.check]
depends = [
  "workflows:check",
  "secrets:check",
  "names:check",
]
